<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Updates Explorer</title>
    <meta name="description" content="Explore Minecraft Java updates by version or year, including blocks, items, mobs, mob variants, effects, enchantments, advancements, paintings, biomes, structures, statistics, comparisons, and material groups.">
    <meta name="application-name" content="Minecraft Updates Explorer">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0f0f12">
    <link rel="canonical" href="https://kfgod.github.io/minecraft_folder/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Minecraft Updates Explorer">
    <meta property="og:title" content="Minecraft Updates Explorer">
    <meta property="og:description" content="Browse Minecraft Java versions, blocks, items, mobs, statistics, comparisons, time-since data, and material groups in one searchable explorer.">
    <meta property="og:url" content="https://kfgod.github.io/minecraft_folder/">
    <meta property="og:image" content="https://kfgod.github.io/minecraft_folder/static/images/missing_texture.png">
    <meta property="og:image:alt" content="Minecraft-style missing texture placeholder">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Minecraft Updates Explorer">
    <meta name="twitter:description" content="Search and compare Minecraft Java updates, content additions, statistics, and material groups.">
    <meta name="twitter:image" content="https://kfgod.github.io/minecraft_folder/static/images/missing_texture.png">
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Minecraft Updates Explorer",
            "url": "https://kfgod.github.io/minecraft_folder/",
            "applicationCategory": "ReferenceApplication",
            "operatingSystem": "Any",
            "description": "A searchable explorer for Minecraft Java updates, content additions, statistics, comparisons, and material groups.",
            "isAccessibleForFree": true,
            "inLanguage": "en"
        }
    </script>
</head>

<body class="no-transition">
    <noscript>
        <section class="noscript-seo-summary">
            <h1>Minecraft Updates Explorer</h1>
            <p>Browse Minecraft Java updates by version or year, including blocks, items, mobs, mob variants, effects, enchantments, advancements, paintings, biomes, structures, statistics, comparisons, time-since data, and material groups.</p>
        </section>
    </noscript>
    <aside id="controls-panel" aria-label="Controls">
        <div class="controls-content">
            <div class="side-brand">
                <span class="side-brand-mark" aria-hidden="true"></span>
                <span>Minecraft Updates</span>
            </div>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search across all content..." list="search-suggestions" aria-label="Search">
                <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" hidden>&times;</button>
            </div>
            <datalist id="search-suggestions"></datalist>
            <div class="toggle-switch side-segmented">
                <div id="toggle-versions" class="toggle-switch-label active" data-view="versions" role="button" tabindex="0" aria-label="View by versions">Versions</div>
                <div id="toggle-years" class="toggle-switch-label" data-view="years" role="button" tabindex="0" aria-label="View by years">Years</div>
            </div>

            <nav class="side-section" aria-label="Pages">
                <button id="explore-btn" type="button" class="side-link">Explore</button>
                <button id="stats-btn" type="button" class="side-link">Statistics</button>
                <button id="compare-btn" type="button" class="side-link">Compare</button>
                <button id="time-since-btn" type="button" class="side-link">Time Since</button>
                <button id="biome-content-btn" type="button" class="side-link">Biome Content</button>
                <button id="material-groups-btn" type="button" class="side-link">Material Groups</button>
            </nav>

            <section class="side-section" aria-labelledby="side-show-heading">
                <div class="side-heading-row">
                    <h2 class="side-heading" id="side-show-heading">Show</h2>
                    <span class="side-heading-actions">
                        <button id="filters-select-all" type="button" class="side-text-button" aria-label="Select all filters">All</button>
                        <button id="filters-select-none" type="button" class="side-text-button" aria-label="Clear all filters">None</button>
                    </span>
                </div>
                <div class="filter-chips">
                    <label class="filter-chip"><input type="checkbox" id="show-blocks-checkbox" checked><span>Blocks</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-items-checkbox" checked><span>Items</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-mobs-checkbox" checked><span>Mobs</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-mob-variants-checkbox" checked><span>Mob Variants</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-effects-checkbox" checked><span>Effects</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-enchantments-checkbox" checked><span>Enchantments</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-advancements-checkbox" checked><span>Advancements</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-paintings-checkbox" checked><span>Paintings</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-biomes-checkbox" checked><span>Biomes</span></label>
                    <label class="filter-chip"><input type="checkbox" id="show-structures-checkbox" checked><span>Structures</span></label>
                </div>
            </section>

            <section class="side-section" aria-labelledby="side-options-heading">
                <h2 class="side-heading" id="side-options-heading">Options</h2>
                <label class="side-switch" title="Hide entries marked as hidden duplicates.">
                    <input type="checkbox" id="remove-duplicates-checkbox" role="switch" checked>
                    <span>Remove duplicates</span>
                </label>
                <label class="side-switch">
                    <input type="checkbox" id="show-notable-changes-checkbox" role="switch" checked>
                    <span>Notable changes in list</span>
                </label>
            </section>

            <footer class="side-footer">
                <div class="theme-toggle" role="group" aria-label="Color theme">
                    <button id="theme-dark-btn" type="button" class="theme-toggle-btn active" data-theme="dark" aria-pressed="true">Dark</button>
                    <button id="theme-light-btn" type="button" class="theme-toggle-btn" data-theme="light" aria-pressed="false">Light</button>
                </div>
                <p class="disclaimer-text">
                    Some images are sourced from <a href="https://minecraft.wiki" target="_blank" rel="noopener noreferrer">minecraft.wiki</a>.
                    Not an official Minecraft website. Not approved by or associated with Mojang or Microsoft.
                </p>
            </footer>
        </div>
    </aside>
    <main>
        <div class="mobile-top-bar">
            <div class="search-container mobile-search-container">
                <input type="text" id="mobile-search-bar" placeholder="Search across all content..." list="search-suggestions" aria-label="Search">
                <button id="mobile-search-clear-btn" class="search-clear-btn" aria-label="Clear search" hidden>&times;</button>
            </div>
            <button id="filters-fab" type="button" class="filters-fab" aria-label="Open filters">Filters</button>
            <button id="nav-fab" type="button" class="nav-fab" aria-label="Open navigation">Nav</button>
        </div>
        <button id="nav-toggle-btn" aria-label="Open Navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="content"></div>
    </main>
    <nav id="nav-panel">
        <header class="nav-header">
            <h3>Navigation</h3>
            <a href="#" id="scroll-to-top-btn" aria-label="Scroll to top">↑</a>
        </header>
        <div class="nav-controls">
            <input id="nav-search" type="text" placeholder="Filter navigation..." aria-label="Filter navigation">
            <select id="nav-jump" aria-label="Jump to version or year">
                <option value="">Jump to…</option>
            </select>
        </div>
        <ul id="nav-list"></ul>
    </nav>
    <div id="overlay"></div>
    <div id="filters-overlay"></div>
    <div id="nav-overlay"></div>
    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
